name: CI — Build, Lint, Type Check, Deploy to Vercel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

      - name: Lint check
        run: npx eslint . --max-warnings=0 || exit 1

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy to Vercel (if on main branch)
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v35
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-env-vars: |
            VERCEL_ENV=production

      - name: Report build failure (GitHub notification)
        if: failure()
        run: |
          echo "🚨 Build failed on branch '${{ github.ref_name }}' at commit '${{ github.sha }}'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Failure Details" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Action: Build & Deploy Pipeline" >> $GITHUB_STEP_SUMMARY
